name: tag release

# Every version that reaches main gets its tag, v<version>, read from the plugin manifest, and the tag
# opens the registry pull request that moves the oto-factory pin to it (the engine's reusable
# registry-pin workflow). It needs the secret OTO_REGISTRY_TOKEN, as the engine's does; without it the
# run says how to move the pin by hand.

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the version when it is new
        id: tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
            echo "tagged $tag"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  pin:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: Cynergis/oto/.github/workflows/registry-pin.yml@main
    with:
      plugin: oto-factory
      repo: Cynergis/oto-factory
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      changelog: CHANGELOG.md
    secrets:
      OTO_REGISTRY_TOKEN: ${{ secrets.OTO_REGISTRY_TOKEN }}
